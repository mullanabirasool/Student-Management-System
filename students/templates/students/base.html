<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Student Management System
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: #0f766e;
        }

        .navbar-brand,
        .nav-link {
            color: white !important;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .stat-card {
            padding: 25px;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
        }

        .btn-primary {
            background: #0f766e;
            border-color: #0f766e;
        }

        .btn-primary:hover {
            background: #115e59;
            border-color: #115e59;
        }

        .table th {
            background: #0f766e;
            color: white;
        }

        .container {
            max-width: 1200px;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{% url 'dashboard' %}"
        >
            Student Management
        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarMenu"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div
            class="collapse navbar-collapse"
            id="navbarMenu"
        >

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="{% url 'dashboard' %}"
                    >
                        Dashboard
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="{% url 'student_list' %}"
                    >
                        Students
                    </a>
                </li>

                <li class="nav-item">
                    <a
                        class="nav-link"
                        href="{% url 'student_create' %}"
                    >
                        Register Student
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<div class="container py-4">

    {% if messages %}

        {% for message in messages %}

            <div
                class="alert alert-{{ message.tags }} alert-dismissible fade show"
                role="alert"
            >

                {{ message }}

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                ></button>

            </div>

        {% endfor %}

    {% endif %}


    {% block content %}

    {% endblock %}

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>

</body>

</html>
